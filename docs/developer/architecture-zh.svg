<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1160" width="1200" height="1160" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">Lyra Code 分层架构图</title>
  <desc id="archDesc">入口层、编排层、Agent 内核、模型接入、工具与能力层、数据与状态、平台与外部，共七层，箭头表示调用方向。</desc>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#6f6489"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .panel { fill: #ffffff; stroke-width: 1.4; }
      .box { fill: #ffffff; stroke: #b8b0c9; stroke-width: 1.1; }
      .t { font-family: "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; fill: #2b2536; }
      .k { font-size: 14px; font-weight: 600; }
      .s { font-size: 11.5px; fill: #5d5871; }
      .p { font-size: 14.5px; font-weight: 700; }
      .a { font-size: 11.5px; fill: #6f6489; }
      .ar { stroke: #6f6489; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="1160" rx="14"/>

  <!-- 1. 入口层 -->
  <rect class="panel" x="40" y="16" width="1120" height="118" rx="12" fill="#f4effb" stroke="#cbb8e4"/>
  <text class="t p" x="58" y="42">入口层 · 界面与外部触发</text>
  <rect class="box" x="56" y="52" width="250" height="66" rx="8"/>
  <text class="t k" x="70" y="78">对话 / 文件 / 编辑器</text>
  <text class="t s" x="70" y="99">Compose AppShell 主界面</text>
  <rect class="box" x="320" y="52" width="250" height="66" rx="8"/>
  <text class="t k" x="334" y="78">网页访问</text>
  <text class="t s" x="334" y="99">手机对话页面，同一控制器</text>
  <rect class="box" x="584" y="52" width="250" height="66" rx="8"/>
  <text class="t k" x="598" y="78">终端 · 日志 · 统计</text>
  <text class="t s" x="598" y="99">本地与 SSH 终端 · 日志与统计</text>
  <rect class="box" x="848" y="52" width="296" height="66" rx="8"/>
  <text class="t k" x="862" y="78">悬浮窗 · 桌宠 · 外部触发</text>
  <text class="t s" x="862" y="99">前台通知 · MCP 服务端 · 定时任务</text>

  <line class="ar" x1="600" y1="134" x2="600" y2="160" marker-end="url(#ah)"/>
  <text class="t a" x="614" y="152">用户动作 / 状态回流</text>

  <!-- 2. 编排层 -->
  <rect class="panel" x="40" y="164" width="1120" height="110" rx="12" fill="#eaf2fd" stroke="#a9c4e8"/>
  <text class="t p" x="58" y="190">编排层 · 会话与运行生命周期</text>
  <rect class="box" x="56" y="200" width="330" height="60" rx="8"/>
  <text class="t k" x="70" y="225">ChatRuntime</text>
  <text class="t s" x="70" y="246">进程级单例，装配全部管理器</text>
  <rect class="box" x="400" y="200" width="330" height="60" rx="8"/>
  <text class="t k" x="414" y="225">ChatController</text>
  <text class="t s" x="414" y="246">用户动作、等待器、状态回流</text>
  <rect class="box" x="744" y="200" width="400" height="60" rx="8"/>
  <text class="t k" x="758" y="225">ConversationRunLifecycle</text>
  <text class="t s" x="758" y="246">发送、停止、继续、资源释放</text>

  <line class="ar" x1="600" y1="274" x2="600" y2="300" marker-end="url(#ah)"/>
  <text class="t a" x="614" y="292">发起任务</text>

  <!-- 3. Agent 内核 -->
  <rect class="panel" x="40" y="304" width="760" height="250" rx="12" fill="#ecf7ec" stroke="#a9cfa9"/>
  <text class="t p" x="58" y="330">Agent 内核 · OpenAiAgent</text>
  <rect class="box" x="56" y="342" width="728" height="60" rx="8"/>
  <text class="t k" x="70" y="367">请求组装 · 流式解析 · 工具循环 · 重试</text>
  <text class="t s" x="70" y="388">按协议构造历史与工具定义，逐轮执行工具调用</text>
  <rect class="box" x="56" y="414" width="352" height="56" rx="8"/>
  <text class="t k" x="70" y="438">AgentToolSchemaFactory</text>
  <text class="t s" x="70" y="458">模型可见契约与参数</text>
  <rect class="box" x="424" y="414" width="360" height="56" rx="8"/>
  <text class="t k" x="438" y="438">ToolApproval · 作用域检查</text>
  <text class="t s" x="438" y="458">关闭工具、子代理写入、设备会话</text>
  <rect class="box" x="56" y="482" width="352" height="56" rx="8"/>
  <text class="t k" x="70" y="506">能力开关 · 纯提示模式</text>
  <text class="t s" x="70" y="526">决定提供给模型的工具集合</text>
  <rect class="box" x="424" y="482" width="360" height="56" rx="8"/>
  <text class="t k" x="438" y="506">子代理编排</text>
  <text class="t s" x="438" y="526">SubAgentBatchRunner · 写入协调</text>

  <line class="ar" x1="800" y1="372" x2="824" y2="372" marker-end="url(#ah)"/>

  <!-- 3b. 模型接入 -->
  <rect class="panel" x="824" y="304" width="336" height="250" rx="12" fill="#fdf3e6" stroke="#e3c193"/>
  <text class="t p" x="842" y="330">模型接入</text>
  <rect class="box" x="840" y="342" width="304" height="54" rx="8"/>
  <text class="t k" x="854" y="366">服务商适配</text>
  <text class="t s" x="854" y="386">Completions / Responses / Anthropic / Gemini</text>
  <rect class="box" x="840" y="404" width="304" height="54" rx="8"/>
  <text class="t k" x="854" y="428">拦截器链</text>
  <text class="t s" x="854" y="448">Key 轮换 · 账号凭证 · Gzip · HTTP 审计</text>
  <rect class="box" x="840" y="466" width="304" height="38" rx="8"/>
  <text class="t k" x="854" y="490">模型请求自定义（Header / Body）</text>
  <rect class="box" x="840" y="512" width="304" height="34" rx="8" stroke-dasharray="5 4"/>
  <text class="t s" x="854" y="533">外部：OpenAI 兼容 · Anthropic · New API · Harness</text>

  <line class="ar" x1="400" y1="554" x2="400" y2="580" marker-end="url(#ah)"/>
  <text class="t a" x="414" y="572">工具调用 / 结果回填</text>

  <!-- 4. 工具与能力层 -->
  <rect class="panel" x="40" y="584" width="1120" height="300" rx="12" fill="#e9f5f8" stroke="#a5cdd8"/>
  <text class="t p" x="58" y="610">工具与能力层 · Handler 与执行器（每次调用仍检查权限）</text>
  <rect class="box" x="56" y="622" width="340" height="110" rx="8"/>
  <text class="t k" x="70" y="648">文件与工作区</text>
  <text class="t s" x="70" y="670">NativeFileManager · GlobalFileManager</text>
  <text class="t s" x="70" y="690">ProotPathResolver · 变更 Diff</text>
  <rect class="box" x="412" y="622" width="340" height="110" rx="8"/>
  <text class="t k" x="426" y="648">命令与终端</text>
  <text class="t s" x="426" y="670">PRoot · Termux · SSH</text>
  <text class="t s" x="426" y="690">Shizuku / Root（按能力启用）</text>
  <rect class="box" x="768" y="622" width="376" height="110" rx="8"/>
  <text class="t k" x="782" y="648">Linux 图形 · lyra_x11</text>
  <text class="t s" x="782" y="670">X11 会话 · 悬浮窗 · 截图</text>
  <text class="t s" x="782" y="690">原生 DDX 或 VNC 回退 · 会话音频</text>
  <rect class="box" x="56" y="746" width="340" height="110" rx="8"/>
  <text class="t k" x="70" y="772">MCP</text>
  <text class="t s" x="70" y="794">McpClientManager：连接外部服务</text>
  <text class="t s" x="70" y="814">LocalMcpServerManager：暴露工具</text>
  <rect class="box" x="412" y="746" width="340" height="110" rx="8"/>
  <text class="t k" x="426" y="772">网页与本地服务</text>
  <text class="t s" x="426" y="794">WebAccessBridge：浏览器桥接</text>
  <text class="t s" x="426" y="814">MiniServerManager：静态预览</text>
  <rect class="box" x="768" y="746" width="376" height="110" rx="8"/>
  <text class="t k" x="782" y="772">远程与设备</text>
  <text class="t s" x="782" y="794">WebDAV · FTP/SFTP · 邮件</text>
  <text class="t s" x="782" y="814">设备交互 · 桌宠 · 下载与定时任务</text>

  <line class="ar" x1="600" y1="884" x2="600" y2="910" marker-end="url(#ah)"/>
  <text class="t a" x="614" y="902">记录 / 审计 / 状态</text>

  <!-- 5. 数据与状态 -->
  <rect class="panel" x="40" y="914" width="700" height="200" rx="12" fill="#f7f1fa" stroke="#cbbcd9"/>
  <text class="t p" x="58" y="940">数据与状态 · 设备本地</text>
  <rect class="box" x="56" y="952" width="320" height="66" rx="8"/>
  <text class="t k" x="70" y="978">ConversationStore · AppSettings</text>
  <text class="t s" x="70" y="999">会话、分支、设置、版本迁移</text>
  <rect class="box" x="392" y="952" width="332" height="66" rx="8"/>
  <text class="t k" x="406" y="978">AuditLogStore · 用量统计</text>
  <text class="t s" x="406" y="999">请求审计与 Token 记录</text>
  <rect class="box" x="56" y="1032" width="320" height="66" rx="8"/>
  <text class="t k" x="70" y="1058">BackupManager</text>
  <text class="t s" x="70" y="1079">导出、导入与密钥导出策略</text>
  <rect class="box" x="392" y="1032" width="332" height="66" rx="8"/>
  <text class="t k" x="406" y="1058">加密账号存储</text>
  <text class="t s" x="406" y="1079">New API · ChatGPT · Harness 凭证</text>

  <!-- 6. 平台与外部 -->
  <rect class="panel" x="760" y="914" width="400" height="200" rx="12" fill="#f2f4f7" stroke="#c3c9d6"/>
  <text class="t p" x="778" y="940">平台与外部环境</text>
  <rect class="box" x="776" y="952" width="368" height="66" rx="8"/>
  <text class="t k" x="790" y="978">Android 系统能力</text>
  <text class="t s" x="790" y="999">SAF · 通知 · 前台服务 · 悬浮与音频</text>
  <rect class="box" x="776" y="1032" width="368" height="66" rx="8"/>
  <text class="t k" x="790" y="1058">PRoot rootfs · Termux</text>
  <text class="t s" x="790" y="1079">发行版镜像 · 外部命令环境</text>

  <text class="t a" x="40" y="1144">实线箭头表示调用方向；虚线框为应用之外的系统。展开细节见「模块职责」与「协议与流式适配」。</text>
</svg>
