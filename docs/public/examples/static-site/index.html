<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lyra Code Preview</title>
  <style>
    :root { font: 18px/1.6 system-ui, sans-serif; color: #17213d; background: #f4f6fc; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { max-width: 32rem; margin: 1.5rem; padding: 2rem; background: white; border-radius: 1rem; }
    button { font: inherit; padding: .6rem 1rem; background: #3659d9; color: white; border: 0; border-radius: .5rem; cursor: pointer; }
    button:focus-visible { outline: 3px solid #b15316; outline-offset: 4px; }
    output { font-weight: bold; }
  </style>
</head>
<body>
  <main>
    <h1>Hello, Lyra Code!</h1>
    <p>网页已从工作区加载。This page runs without a build step.</p>
    <button id="counter" type="button">点击计数 / Count</button>
    <p aria-live="polite">Count: <output id="value">0</output></p>
  </main>
  <script>
    let count = 0;
    document.querySelector('#counter').addEventListener('click', () => {
      document.querySelector('#value').textContent = String(++count);
    });
    console.info('Lyra preview ready');
  </script>
</body>
</html>
