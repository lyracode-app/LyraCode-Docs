<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1160" width="1200" height="1160" role="img" aria-labelledby="archTitleEn archDescEn">
  <title id="archTitleEn">Lyra Code layered architecture</title>
  <desc id="archDescEn">Seven layers: entry surfaces, orchestration, agent core, model access, tools and capabilities, data and state, platform and external systems. Arrows show call direction.</desc>
  <defs>
    <marker id="ahe" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#6f6489"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .panel { fill: #ffffff; stroke-width: 1.4; }
      .box { fill: #ffffff; stroke: #b8b0c9; stroke-width: 1.1; }
      .t { font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif; fill: #2b2536; }
      .k { font-size: 13.5px; font-weight: 600; }
      .s { font-size: 11px; fill: #5d5871; }
      .p { font-size: 14.5px; font-weight: 700; }
      .a { font-size: 11.5px; fill: #6f6489; }
      .ar { stroke: #6f6489; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="1160" rx="14"/>

  <!-- 1. Entry -->
  <rect class="panel" x="40" y="16" width="1120" height="118" rx="12" fill="#f4effb" stroke="#cbb8e4"/>
  <text class="t p" x="58" y="42">Entry layer · UI and external triggers</text>
  <rect class="box" x="56" y="52" width="250" height="66" rx="8"/>
  <text class="t k" x="70" y="78">Chat / files / editor</text>
  <text class="t s" x="70" y="99">Compose AppShell</text>
  <rect class="box" x="320" y="52" width="250" height="66" rx="8"/>
  <text class="t k" x="334" y="78">Web access</text>
  <text class="t s" x="334" y="99">Phone chat page, same controller</text>
  <rect class="box" x="584" y="52" width="250" height="66" rx="8"/>
  <text class="t k" x="598" y="78">Terminal · logs · stats</text>
  <text class="t s" x="598" y="99">Local and SSH terminals · logs and stats</text>
  <rect class="box" x="848" y="52" width="296" height="66" rx="8"/>
  <text class="t k" x="862" y="78">Overlays · pets · external triggers</text>
  <text class="t s" x="862" y="99">Foreground notices · MCP server · schedules</text>

  <line class="ar" x1="600" y1="134" x2="600" y2="160" marker-end="url(#ahe)"/>
  <text class="t a" x="614" y="152">user actions / state updates</text>

  <!-- 2. Orchestration -->
  <rect class="panel" x="40" y="164" width="1120" height="110" rx="12" fill="#eaf2fd" stroke="#a9c4e8"/>
  <text class="t p" x="58" y="190">Orchestration · sessions and run lifecycle</text>
  <rect class="box" x="56" y="200" width="330" height="60" rx="8"/>
  <text class="t k" x="70" y="225">ChatRuntime</text>
  <text class="t s" x="70" y="246">Process singleton wiring every manager</text>
  <rect class="box" x="400" y="200" width="330" height="60" rx="8"/>
  <text class="t k" x="414" y="225">ChatController</text>
  <text class="t s" x="414" y="246">Actions, waiters, state updates</text>
  <rect class="box" x="744" y="200" width="400" height="60" rx="8"/>
  <text class="t k" x="758" y="225">ConversationRunLifecycle</text>
  <text class="t s" x="758" y="246">Send, stop, continue, release resources</text>

  <line class="ar" x1="600" y1="274" x2="600" y2="300" marker-end="url(#ahe)"/>
  <text class="t a" x="614" y="292">start a task</text>

  <!-- 3. Agent core -->
  <rect class="panel" x="40" y="304" width="760" height="250" rx="12" fill="#ecf7ec" stroke="#a9cfa9"/>
  <text class="t p" x="58" y="330">Agent core · OpenAiAgent</text>
  <rect class="box" x="56" y="342" width="728" height="60" rx="8"/>
  <text class="t k" x="70" y="367">Request building · stream parsing · tool loop · retry</text>
  <text class="t s" x="70" y="388">Builds history and tool definitions per protocol, runs tool calls round by round</text>
  <rect class="box" x="56" y="414" width="352" height="56" rx="8"/>
  <text class="t k" x="70" y="438">AgentToolSchemaFactory</text>
  <text class="t s" x="70" y="458">Model-visible contract and arguments</text>
  <rect class="box" x="424" y="414" width="360" height="56" rx="8"/>
  <text class="t k" x="438" y="438">ToolApproval · scope checks</text>
  <text class="t s" x="438" y="458">Disabled tools, sub-agent writes, device sessions</text>
  <rect class="box" x="56" y="482" width="352" height="56" rx="8"/>
  <text class="t k" x="70" y="506">Capability switches · pure prompt mode</text>
  <text class="t s" x="70" y="526">Decides which tools the model receives</text>
  <rect class="box" x="424" y="482" width="360" height="56" rx="8"/>
  <text class="t k" x="438" y="506">Sub-agent orchestration</text>
  <text class="t s" x="438" y="526">SubAgentBatchRunner · write coordination</text>

  <line class="ar" x1="800" y1="372" x2="824" y2="372" marker-end="url(#ahe)"/>

  <!-- 3b. Model access -->
  <rect class="panel" x="824" y="304" width="336" height="250" rx="12" fill="#fdf3e6" stroke="#e3c193"/>
  <text class="t p" x="842" y="330">Model access</text>
  <rect class="box" x="840" y="342" width="304" height="54" rx="8"/>
  <text class="t k" x="854" y="366">Provider adapters</text>
  <text class="t s" x="854" y="386">Completions / Responses / Anthropic / Gemini</text>
  <rect class="box" x="840" y="404" width="304" height="54" rx="8"/>
  <text class="t k" x="854" y="428">Interceptor chain</text>
  <text class="t s" x="854" y="448">Key rotation · account credentials · gzip · audit</text>
  <rect class="box" x="840" y="466" width="304" height="38" rx="8"/>
  <text class="t k" x="854" y="490">Request customization (headers / body)</text>
  <rect class="box" x="840" y="508" width="304" height="40" rx="8" stroke-dasharray="5 4"/>
  <text class="t s" x="854" y="524">External providers and gateways:</text>
  <text class="t s" x="854" y="540">OpenAI-compatible · Anthropic · New API · Harness</text>

  <line class="ar" x1="400" y1="554" x2="400" y2="580" marker-end="url(#ahe)"/>
  <text class="t a" x="414" y="572">tool calls / results</text>

  <!-- 4. Tools -->
  <rect class="panel" x="40" y="584" width="1120" height="300" rx="12" fill="#e9f5f8" stroke="#a5cdd8"/>
  <text class="t p" x="58" y="610">Tools and capabilities · handlers and executors (every call still checks permissions)</text>
  <rect class="box" x="56" y="622" width="340" height="110" rx="8"/>
  <text class="t k" x="70" y="648">Files and workspace</text>
  <text class="t s" x="70" y="670">NativeFileManager · GlobalFileManager</text>
  <text class="t s" x="70" y="690">ProotPathResolver · change diffs</text>
  <rect class="box" x="412" y="622" width="340" height="110" rx="8"/>
  <text class="t k" x="426" y="648">Commands and terminal</text>
  <text class="t s" x="426" y="670">PRoot · Termux · SSH</text>
  <text class="t s" x="426" y="690">Shizuku / Root when available</text>
  <rect class="box" x="768" y="622" width="376" height="110" rx="8"/>
  <text class="t k" x="782" y="648">Linux GUI · lyra_x11</text>
  <text class="t s" x="782" y="670">X11 sessions · overlays · screenshots</text>
  <text class="t s" x="782" y="690">Native DDX or VNC fallback · session audio</text>
  <rect class="box" x="56" y="746" width="340" height="110" rx="8"/>
  <text class="t k" x="70" y="772">MCP</text>
  <text class="t s" x="70" y="794">McpClientManager: outbound servers</text>
  <text class="t s" x="70" y="814">LocalMcpServerManager: expose tools</text>
  <rect class="box" x="412" y="746" width="340" height="110" rx="8"/>
  <text class="t k" x="426" y="772">Web and local services</text>
  <text class="t s" x="426" y="794">WebAccessBridge: browser bridge</text>
  <text class="t s" x="426" y="814">MiniServerManager: static preview</text>
  <rect class="box" x="768" y="746" width="376" height="110" rx="8"/>
  <text class="t k" x="782" y="772">Remote and device</text>
  <text class="t s" x="782" y="794">WebDAV · FTP/SFTP · email</text>
  <text class="t s" x="782" y="814">Device interaction · pets · downloads and schedules</text>

  <line class="ar" x1="600" y1="884" x2="600" y2="910" marker-end="url(#ahe)"/>
  <text class="t a" x="614" y="902">records / audit / state</text>

  <!-- 5. Data -->
  <rect class="panel" x="40" y="914" width="700" height="200" rx="12" fill="#f7f1fa" stroke="#cbbcd9"/>
  <text class="t p" x="58" y="940">Data and state · on device</text>
  <rect class="box" x="56" y="952" width="320" height="66" rx="8"/>
  <text class="t k" x="70" y="978">ConversationStore · AppSettings</text>
  <text class="t s" x="70" y="999">Conversations, branches, settings, migrations</text>
  <rect class="box" x="392" y="952" width="332" height="66" rx="8"/>
  <text class="t k" x="406" y="978">AuditLogStore · usage stats</text>
  <text class="t s" x="406" y="999">Request audit and token records</text>
  <rect class="box" x="56" y="1032" width="320" height="66" rx="8"/>
  <text class="t k" x="70" y="1058">BackupManager</text>
  <text class="t s" x="70" y="1079">Export, import and secret policy</text>
  <rect class="box" x="392" y="1032" width="332" height="66" rx="8"/>
  <text class="t k" x="406" y="1058">Encrypted account store</text>
  <text class="t s" x="406" y="1079">New API · ChatGPT · Harness credentials</text>

  <!-- 6. Platform -->
  <rect class="panel" x="760" y="914" width="400" height="200" rx="12" fill="#f2f4f7" stroke="#c3c9d6"/>
  <text class="t p" x="778" y="940">Platform and environment</text>
  <rect class="box" x="776" y="952" width="368" height="66" rx="8"/>
  <text class="t k" x="790" y="978">Android capabilities</text>
  <text class="t s" x="790" y="999">SAF · notifications · foreground services · overlay, audio</text>
  <rect class="box" x="776" y="1032" width="368" height="66" rx="8"/>
  <text class="t k" x="790" y="1058">PRoot rootfs · Termux</text>
  <text class="t s" x="790" y="1079">Distribution images · external command environment</text>

  <text class="t a" x="40" y="1144">Solid arrows show call direction; dashed boxes are systems outside the app. See Modules and Providers for details.</text>
</svg>
